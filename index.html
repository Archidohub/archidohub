<style>
  /* ================================
     ARCHIDOHUB — PINTEREST GEN-Z THEME
     EDIT COLORS HERE
  ================================= */

  :root {
    --bg: #f6f3ef;
    --surface: #fffdf9;
    --surface-2: #eee9e3;
    --text: #191817;
    --muted: #77716b;
    --border: #e5dfd8;

    --pink: #e7c9d0;
    --lavender: #dcd5e8;
    --sage: #d9dfd2;
    --peach: #ead4c2;

    --dark: #191817;
    --white: #ffffff;

    --radius: 24px;
  }

  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  html {
    scroll-behavior: smooth;
  }

  body {
    font-family: Arial, Helvetica, sans-serif;
    background: var(--bg);
    color: var(--text);
  }

  a {
    text-decoration: none;
    color: inherit;
  }

  button {
    font-family: inherit;
    cursor: pointer;
  }

  /* ================================
     ANNOUNCEMENT BAR
  ================================= */

  .announcement {
    background: var(--dark);
    color: white;
    text-align: center;
    padding: 9px 15px;
    font-size: 12px;
    letter-spacing: 1px;
  }

  /* ================================
     NAVBAR
  ================================= */

  nav {
    height: 76px;
    display: flex;
    align-items: center;
    justify-content: space-between;

    padding: 0 6%;

    background: rgba(246, 243, 239, 0.92);

    border-bottom: 1px solid var(--border);

    position: sticky;
    top: 0;
    z-index: 100;

    backdrop-filter: blur(15px);
  }

  .logo {
    font-size: 24px;
    font-weight: 800;
    letter-spacing: -1.5px;
  }

  .logo span {
    font-weight: 400;
  }

  .nav-links {
    display: flex;
    gap: 28px;
    font-size: 13px;
  }

  .nav-links a {
    transition: .2s;
  }

  .nav-links a:hover {
    opacity: .45;
  }

  .nav-icons {
    display: flex;
    gap: 8px;
  }

  .icon-btn {
    width: 39px;
    height: 39px;

    border: 1px solid var(--border);
    border-radius: 50%;

    background: var(--surface);

    font-size: 16px;

    transition: .2s;
  }

  .icon-btn:hover {
    background: var(--dark);
    color: white;
    transform: translateY(-2px);
  }

  /* ================================
     HERO
  ================================= */

  .hero {
    width: 88%;
    margin: 28px auto 90px;

    min-height: 560px;

    border-radius: 32px;

    background:
      linear-gradient(
        120deg,
        #ead4d8 0%,
        #e7ddec 45%,
        #dfe4d9 100%
      );

    display: flex;
    align-items: center;

    padding: 70px;

    overflow: hidden;

    position: relative;
  }

  .hero-content {
    max-width: 600px;
    position: relative;
    z-index: 2;
  }

  .small-label {
    display: inline-block;

    background: rgba(255,255,255,.55);

    padding: 8px 13px;

    border-radius: 30px;

    text-transform: uppercase;

    font-size: 10px;

    letter-spacing: 2px;

    margin-bottom: 22px;
  }

  .hero h1 {
    font-size: clamp(48px, 7vw, 94px);

    line-height: .88;

    letter-spacing: -6px;

    max-width: 650px;

    margin-bottom: 28px;
  }

  .hero p {
    max-width: 470px;

    color: #514d49;

    line-height: 1.7;

    font-size: 15px;

    margin-bottom: 30px;
  }

  .hero-buttons {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
  }

  .btn {
    border: none;

    padding: 14px 24px;

    border-radius: 40px;

    font-weight: 600;

    transition: .25s;
  }

  .btn-dark {
    background: var(--dark);
    color: white;
  }

  .btn-light {
    background: rgba(255,255,255,.75);
    color: var(--dark);
  }

  .btn:hover {
    transform: translateY(-3px);
  }

  .hero-circle {
    position: absolute;

    right: -70px;
    bottom: -110px;

    width: 520px;
    height: 520px;

    border-radius: 50%;

    background:
      radial-gradient(
        circle at 35% 30%,
        #fff6f0,
        #d8c6d4
      );

    box-shadow:
      -30px 30px 100px rgba(0,0,0,.08);
  }

  /* ================================
     SECTIONS
  ================================= */

  .section {
    width: 88%;
    margin: 0 auto 90px;
  }

  .section-heading {
    display: flex;

    justify-content: space-between;
    align-items: end;

    margin-bottom: 28px;
  }

  .section-heading h2 {
    font-size: 38px;

    letter-spacing: -2px;
  }

  .section-heading a {
    font-size: 13px;
    text-decoration: underline;
  }

  /* ================================
     PRODUCT GRID
  ================================= */

  .products {
    display: grid;

    grid-template-columns:
      repeat(4, 1fr);

    gap: 18px;
  }

  .product-card {
    background: var(--surface);

    border-radius: var(--radius);

    overflow: hidden;

    position: relative;

    border: 1px solid rgba(0,0,0,.035);

    transition:
      transform .3s ease,
      box-shadow .3s ease;
  }

  .product-card:hover {
    transform: translateY(-7px);

    box-shadow:
      0 18px 40px rgba(30,25,20,.09);
  }

  .product-image {
    height: 300px;

    background:
      linear-gradient(
        135deg,
        #eee9e3,
        #e5dfe8
      );

    display: flex;

    align-items: center;
    justify-content: center;

    overflow: hidden;
  }

  .product-image img {
    width: 100%;
    height: 100%;

    object-fit: cover;

    transition: .4s;
  }

  .product-card:hover .product-image img {
    transform: scale(1.05);
  }

  .placeholder {
    font-size: 55px;

    color: rgba(25,24,23,.25);
  }

  .product-info {
    padding: 17px;
  }

  .badge {
    display: inline-block;

    font-size: 9px;

    letter-spacing: 1px;

    background: var(--dark);

    color: white;

    padding: 6px 10px;

    border-radius: 20px;

    margin-bottom: 10px;
  }

  .product-name {
    font-weight: 600;

    font-size: 15px;

    margin-bottom: 9px;
  }

  .price {
    font-weight: 700;
  }

  .old-price {
    color: #aaa;

    text-decoration: line-through;

    font-size: 12px;

    margin-left: 5px;
  }

  .add-btn {
    width: 100%;

    margin-top: 15px;

    padding: 12px;

    border-radius: 13px;

    border: 1px solid var(--border);

    background: var(--surface-2);

    font-weight: 600;

    transition: .2s;
  }

  .add-btn:hover {
    background: var(--dark);
    color: white;
  }

  /* ================================
     SHOP BY MOOD
  ================================= */

  .moods {
    display: grid;

    grid-template-columns:
      repeat(3, 1fr);

    gap: 18px;
  }

  .mood {
    min-height: 260px;

    border-radius: var(--radius);

    padding: 25px;

    display: flex;

    align-items: end;

    font-size: 24px;

    font-weight: 700;

    transition: .3s;

    overflow: hidden;

    position: relative;
  }

  .mood:hover {
    transform: translateY(-5px);
  }

  .mood:nth-child(1) {
    background: var(--pink);
  }

  .mood:nth-child(2) {
    background: var(--lavender);
  }

  .mood:nth-child(3) {
    background: var(--sage);
  }

  .mood:nth-child(4) {
    background: var(--peach);
  }

  .mood:nth-child(5) {
    background: #ded7cd;
  }

  .mood:nth-child(6) {
    background: #d8d4df;
  }

  /* ================================
     PROMOTIONAL BANNER
  ================================= */

  .promo {
    width: 88%;

    margin: 0 auto 90px;

    background: var(--dark);

    color: white;

    border-radius: 32px;

    padding: 75px 30px;

    text-align: center;
  }

  .promo h2 {
    font-size: clamp(38px, 6vw, 70px);

    letter-spacing: -4px;

    margin-bottom: 15px;
  }

  .promo p {
    color: #aaa;

    margin-bottom: 28px;
  }

  /* ================================
     NEWSLETTER
  ================================= */

  .newsletter {
    text-align: center;

    width: 88%;

    margin: 0 auto 90px;
  }

  .newsletter h2 {
    font-size: 40px;

    letter-spacing: -2px;

    margin-bottom: 10px;
  }

  .newsletter p {
    color: var(--muted);

    margin-bottom: 24px;
  }

  .newsletter-form {
    display: flex;

    max-width: 500px;

    margin: auto;

    gap: 8px;
  }

  .newsletter-form input {
    flex: 1;

    border: 1px solid var(--border);

    background: var(--surface);

    border-radius: 40px;

    padding: 14px 18px;

    outline: none;
  }

  /* ================================
     FOOTER
  ================================= */

  footer {
    background: #191817;

    color: white;

    padding: 60px 6%;
  }

  .footer-grid {
    display: grid;

    grid-template-columns:
      2fr 1fr 1fr 1fr;

    gap: 40px;
  }

  footer h3 {
    margin-bottom: 15px;
  }

  footer p,
  footer a {
    color: #aaa;

    font-size: 13px;

    line-height: 2;

    display: block;
  }

  footer a:hover {
    color: white;
  }

  .copyright {
    border-top: 1px solid #333;

    margin-top: 45px;

    padding-top: 20px;

    color: #666;

    font-size: 12px;
  }

  /* ================================
     MOBILE
  ================================= */

  @media (max-width: 900px) {

    .nav-links {
      display: none;
    }

    .hero {
      padding: 45px;

      min-height: 520px;
    }

    .hero-circle {
      width: 400px;
      height: 400px;

      right: -140px;
      opacity: .65;
    }

    .products {
      grid-template-columns:
        repeat(2, 1fr);
    }

    .moods {
      grid-template-columns:
        repeat(2, 1fr);
    }

    .footer-grid {
      grid-template-columns:
        1fr 1fr;
    }
  }

  @media (max-width: 600px) {

    nav {
      padding: 0 4%;
    }

    .hero {
      width: 94%;

      padding: 32px;

      border-radius: 25px;
    }

    .hero h1 {
      font-size: 55px;

      letter-spacing: -4px;
    }

    .section,
    .newsletter,
    .promo {
      width: 94%;
    }

    .products {
      grid-template-columns:
        repeat(2, 1fr);

      gap: 10px;
    }

    .product-image {
      height: 190px;
    }

    .product-info {
      padding: 12px;
    }

    .moods {
      grid-template-columns: 1fr;
    }

    .mood {
      min-height: 210px;
    }

    .promo {
      padding: 50px 22px;
    }

    .newsletter-form {
      flex-direction: column;
    }

    .footer-grid {
      grid-template-columns: 1fr;
    }
  }
</style>
